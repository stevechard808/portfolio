<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stefano Ciardiello · Site under construction</title>
  <meta name="description" content="Portfolio of Stefano Ciardiello, Service-Product & UX Designer. Site in progress, online soon." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Self-contained SVG favicon (SC monogram, adapts to dark mode) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><style>rect{fill:%23FAFAF7}text{fill:%230E0E0E}@media(prefers-color-scheme:dark){rect{fill:%230E0E0E}text{fill:%23FAFAF7}}</style><rect width='100' height='100'/><text x='50' y='56' font-family='monospace' font-size='46' font-weight='700' text-anchor='middle' dominant-baseline='central'>SC</text></svg>" />

  <!-- Open Graph -->
  <meta property="og:title" content="Stefano Ciardiello · Site under construction" />
  <meta property="og:description" content="Portfolio in progress. Online soon." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />

  <!-- Fonts: Figtree (sans) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ---- Design tokens (W3C tokens.json, light) ---- */
    :root {
      --bianco-carta: #FAFAF7;
      --nero: #0E0E0E;
      --blu-segnale: #1D4ED8;
      --grafite: #2B2B2B;
      --alluminio: #5A6B8C;
      --nebbia: #E3E3E0;

      --font-sans: "Figtree", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    /* ---- Dark mode (automatic, no toggle) ---- */
    @media (prefers-color-scheme: dark) {
      :root {
        --bianco-carta: #0E0E0E;
        --nero: #FAFAF7;
        --blu-segnale: #3E61C4;
        --grafite: #C8C8C8;
        --alluminio: #A0B0CC;
        --nebbia: #2B2B2B;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bianco-carta);
      color: var(--nero);
      font-family: var(--font-sans);
      font-weight: 400;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      /* Grid inset: max-width 1440px, padding 24/48/64-80px */
      padding: 24px;
    }

    @media (min-width: 768px) {
      body { padding: 48px; }
    }

    @media (min-width: 1280px) {
      body { padding: 80px 64px; }
    }

    .page {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(48px, 8vw, 96px);
    }

    /* ---- Status eyebrow (mono, uppercase, alluminio) ---- */
    .status {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--alluminio);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 6px;
      height: 6px;
      flex: none;
      background-color: var(--blu-segnale);
      animation: blink 2500ms steps(1, end) infinite;
    }

    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0; }
    }

    /* ---- Hero ---- */
    .hero {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 32px);
    }

    .name {
      font-family: var(--font-sans);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
      /* text-display, fluid clamp */
      font-size: clamp(2.5rem, 8vw, 5.5rem);
    }

    .role {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--alluminio);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .lead {
      max-width: 52ch;
      /* body-read: 17px, line-height 1.6 */
      font-size: 17px;
      line-height: 1.6;
      color: var(--grafite);
    }

    .lead p + p {
      margin-top: 1em;
    }

    /* ---- Footer / contact ---- */
    .foot {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 32px;
      align-items: baseline;
      padding-top: 24px;
      border-top: 1px solid var(--nebbia);
    }

    .meta {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--alluminio);
    }

    a {
      color: var(--blu-segnale);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ---- Focus (2px blu-segnale + 2px offset) ---- */
    a:focus-visible {
      outline: 2px solid var(--blu-segnale);
      outline-offset: 2px;
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="status">
      <span class="dot" aria-hidden="true"></span>
      Work in progress
    </p>

    <section class="hero">
      <h1 class="name">Stefano Ciardiello</h1>
      <p class="role">
        <span class="dot" aria-hidden="true"></span>
        Service-Product &amp; UX Designer
      </p>
      <div class="lead">
        <p>The site is in progress. Online soon.</p>
        <p>To talk about a project, get in touch.</p>
      </div>
    </section>

    <footer class="foot">
      <span class="meta">Contact</span>
      <a href="mailto:steveciardiello@gmail.com">steveciardiello@gmail.com</a>
      <span class="meta">© 2026 Stefano Ciardiello</span>
    </footer>
  </main>
</body>
</html>
